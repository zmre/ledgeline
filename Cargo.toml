# Ledgeline Rust workspace — the journal engine (crates/) that parses hledger
# journals directly and serves a wire-compatible + native local API.
# See plans/00-overview.md and the approved engine plan.
[workspace]
members = ["crates/ledgeline-core", "crates/ledgeline-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Patrick Walsh"]
license = "MIT"
repository = "https://github.com/zmre/ledgeline"

[workspace.dependencies]
# Declared here so both crates share one version. Only what's used today is
# listed; server/runtime deps (axum, tokio, notify) are added as their phases
# land.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
itertools = "0.14"
ledgeline-core = { path = "crates/ledgeline-core" }

# Phase 5 write path: `ropey` is the text-rope over the journal file. Pinned to
# the stable 1.6 line — 1.6.1 (2023-10-18) is the latest stable release and the
# project's recommended LTS; 2.0 is still alpha/beta (2.0.0-beta.1, 2025-08-02)
# so we deliberately stay on 1.6.x.
ropey = "1.6"

# Imports phase, step 6: the CSV column preview reads the first few rows of the
# data file a rules file describes, so the mapping UI can label `%3` with what
# is actually in column 3. Hand-rolling RFC 4180 is the wrong trade — a quoted
# field containing the separator or an embedded newline is exactly what a bank
# CSV has — and the later generate-rules-from-CSV and import-execution steps
# need a real reader anyway. `csv` is BurntSushi's, pure Rust, no unsafe in the
# parsing path, and is the de-facto standard.
csv = "1"

# Enhanced imports (WP-11): the statement preprocessors that normalize a dropped
# file to one tabular extract. See `plans/11-enhanced-import.md` for how each of
# these was chosen — every one was compiled and run against real bank files
# before it was picked, and the OFX crates were all rejected that way.
#
# `calamine` reads xls (BIFF2-8), xlsx, xlsm, xlsb and ods and is still
# uncontested for this. PINNED to an exact version on purpose: 0.36.0 silently
# began trimming XLSX whitespace, and the de-facto maintainer opened an issue in
# July 2026 asking for help, so an unattended minor bump is a real risk to a
# money app. `dates` is what makes `as_datetime()` available — reading a date
# cell as f64 and dividing is how you land a transaction on the wrong day.
calamine = { version = "=0.36.1", features = ["dates"] }

# Text decoding for bank CSVs, which are routinely not UTF-8. `encoding_rs` is
# the WHATWG-spec decoder (the one Firefox ships); `encoding_rs_io` wraps it in a
# Read adapter that does BOM sniffing and transcoding for us — notably including
# UTF-16, which `chardetng` documents that it cannot detect at all. `chardetng`
# is the guesser of last resort, used ONLY after BOM sniffing has come up empty:
# handed BOM'd UTF-16LE (what Excel's "Unicode Text" export writes) it confidently
# answers windows-1252. Note 1.0 changed its API from the 0.1 that most examples
# online still show.
encoding_rs = "0.8"
encoding_rs_io = "0.1"
chardetng = "1"

proptest = "1"
proptest-derive = "0.8"

# Aggressive release optimization. `panic` is left
# at the default "unwind" so the future axum server can catch per-request panics
# instead of aborting the whole local app.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
