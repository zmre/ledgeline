# Build the user manual in docs/ with mbr and publish it to GitHub Pages.
#
# Publishes on every release tag (`v*`, the same trigger as release.yml) and on
# demand via workflow_dispatch. Pull requests that touch docs/ build and
# link-check only, so a broken link fails review rather than a release.
#
# One-time setup: Settings → Pages → Source must be "GitHub Actions".
#
# Modelled on mbr's own docs.yml (github.com/zmre/mbr-markdown-browser). The
# Pages artifact is tarred by hand with --dereference, copied deliberately: mbr
# symlinks assets into the output, and upload-pages-artifact drops the `.mbr/`
# dot-dir that holds the theme and the search index.
#
# mbr comes from its GitHub RELEASE (a pinned version, checked against a
# pinned sha256), not from a Nix build. Building the flake from source cost
# 16-27 minutes per run (runs 43982610660, 43974369666, 43561361224); the
# site itself builds in about a second. mbr's own docs.yml once noted that a
# Nix-built binary links into /nix/store and does not run on a stock runner,
# so the "Check the mbr binary" step below refuses any binary that does. If it
# trips, fall back to building the same version with Nix:
#   nix build --accept-flake-config github:zmre/mbr-markdown-browser/v0.7.4#mbr
# (with determinate-nix-action + cachix-action `zmre`, as this file did before).
name: Docs

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a new mbr release can't change the site between two tags. To
  # bump: change both, taking the sha256 from the release's SHA256SUMS (or the
  # asset digest `gh release view <tag> -R zmre/mbr-markdown-browser --json
  # assets` prints). Keep the justfile's `mbr` on the same tag.
  MBR_VERSION: v0.7.4
  MBR_SHA256: 3499da052f85b02e136ddd014c51ed8786cfa436b552a457ee6075064ef83f2f

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Downloaded to the runner's temp dir, never executed before the checksum
      # matches. curl -f: an HTTP error fails the step instead of saving the
      # error page.
      - name: Download mbr
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/mbr"
          mkdir -p "$dir"
          asset=mbr-linux-x86_64.tar.gz
          curl -fsSL --retry 3 -o "$dir/$asset" \
            "https://github.com/zmre/mbr-markdown-browser/releases/download/$MBR_VERSION/$asset"
          (cd "$dir" && echo "$MBR_SHA256  $asset" | sha256sum -c -)
          tar -xzf "$dir/$asset" -C "$dir"
          bin=$(find "$dir" -type f -name mbr -perm -u+x | head -n 1)
          if [ -z "$bin" ]; then
            echo "::error::No executable named mbr in $asset:"
            find "$dir" -maxdepth 3
            exit 1
          fi
          echo "MBR_BIN=$bin" >> "$GITHUB_ENV"

      # The release binary must be self-contained on a stock runner: no ELF
      # interpreter or library under /nix/store, no unresolved library. Fails
      # loudly rather than producing a half-working site.
      - name: Check the mbr binary
        run: |
          set -euo pipefail
          file "$MBR_BIN"
          libs=$(ldd "$MBR_BIN" 2>&1 || true)
          echo "$libs"
          if { file "$MBR_BIN"; echo "$libs"; } | grep -qE '/nix/store|not found'; then
            echo "::error::mbr $MBR_VERSION's Linux release binary is not self-contained on this runner (see above). Fall back to building it with Nix: nix build --accept-flake-config github:zmre/mbr-markdown-browser/$MBR_VERSION#mbr (see the header of this file)."
            exit 1
          fi
          "$MBR_BIN" --version

      - name: Build site
        env:
          # The site is a GitHub project page, served under /ledgeline/.
          # 404.html is served at whatever URL was missing, so it anchors its
          # assets, site.json and Home link at base_url; left at the default "/"
          # it loads nothing (no styles, no "did you mean" suggestions).
          MBR_BASE_URL: /ledgeline/
        run: |
          "$MBR_BIN" -b --fail-on-broken-links --output ./docs-build ./docs

      - name: Create Pages artifact
        if: github.event_name != 'pull_request'
        run: |
          tar \
            --dereference --hard-dereference \
            --directory ./docs-build \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
