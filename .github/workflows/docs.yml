# Build the user manual in docs/ with mbr and publish it to GitHub Pages.
#
# Publishes on every release tag (`v*`, the same trigger as release.yml) and on
# demand via workflow_dispatch. Pull requests that touch docs/ build and
# link-check only, so a broken link fails review rather than a release.
#
# One-time setup: Settings → Pages → Source must be "GitHub Actions".
#
# Modelled on mbr's own docs.yml (github.com/zmre/mbr-markdown-browser). Two
# things there are load-bearing and copied deliberately:
#   - mbr is built with Nix. The release binary links into /nix/store and does
#     not run on a stock ubuntu runner.
#   - The Pages artifact is tarred by hand with --dereference: mbr symlinks
#     assets into the output, and upload-pages-artifact drops the `.mbr/`
#     dot-dir that holds the theme and the search index.
name: Docs

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to a RELEASE's commit (tag v0.7.4) so a new mbr can't change the
  # site between two tags. A release commit, because mbr's CI pushes each
  # release's `#mbr` to the zmre Cachix, so this substitutes in seconds (the
  # earlier pin was a commit no cache held, and "Build mbr" compiled it from
  # source, 16-27 min). The rev rather than the tag name: a tag can be moved,
  # and this build runs ahead of a deploy with `pages: write`, trusting the
  # remote flake's nixConfig (--accept-flake-config). Same store path either
  # way (`nix eval --raw <ref>#mbr.outPath` matches), so the cache hit stays.
  # To bump: `git ls-remote https://github.com/zmre/mbr-markdown-browser
  # 'refs/tags/vX.Y.Z^{}'`, and keep the tag in this comment.
  # The release's Linux binary is no shortcut: it links into /nix/store (see
  # the header above).
  MBR_FLAKE: github:zmre/mbr-markdown-browser/82eb596545bb477564b714ff350e947b39096684#mbr # v0.7.4

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2

      # Pull-only: mbr's closure lives in the zmre cache (mbr's own CI pushes
      # it), and nothing this job builds is worth pushing back.
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: zmre
          extraPullNames: nix-community
          skipPush: true

      - name: Build mbr
        run: nix build --accept-flake-config -L --out-link mbr "$MBR_FLAKE"

      - name: Build site
        env:
          # The site is a GitHub project page, served under /ledgeline/.
          # 404.html is served at whatever URL was missing, so it anchors its
          # assets, site.json and Home link at base_url; left at the default "/"
          # it loads nothing (no styles, no "did you mean" suggestions).
          MBR_BASE_URL: /ledgeline/
        run: ./mbr/bin/mbr -b --fail-on-broken-links --output ./docs-build ./docs

      - name: Create Pages artifact
        if: github.event_name != 'pull_request'
        run: |
          tar \
            --dereference --hard-dereference \
            --directory ./docs-build \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
