name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The version lives in four places (see scripts/release.sh for why each one
  # exists and how each drifts). Three of them fail SILENTLY: a stale
  # `ledgeline-core` dependency version only breaks `cargo publish`, at the very
  # end of a release; a stale `web/package.json` breaks nothing at all and had
  # already drifted to 0.0.1 against a 0.1.0 workspace before this job existed.
  # Pure bash and no Nix, so it costs seconds and gates nothing else.
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: scripts/release.sh check
        run: ./scripts/release.sh check

  # Fast, cheap gate — runs first and fails early on formatting.
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2

      # PULL-ONLY, here and in every other `cachix-action` block in this repo.
      # Without `skipPush` the action installs a post-build hook that uploads
      # EVERY path the job builds — test runs, clippy output, per-commit
      # binaries, source trees — and on the 5 GB free plan (LRU, shared with
      # mbr) that churn is what kept evicting the one thing worth caching: the
      # crane dependency layer. What IS pushed is now explicit and named:
      #   * `.#cargoArtifacts` (the deps layer), once per platform, by `tests`
      #     (Linux) and `macos`, on pushes AND PRs;
      #   * the user-facing release artifacts, by `build` (Linux) and `macos`,
      #     on pushes to main only, and pinned.
      # See docs/development/building.md → "What CI pushes".
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: zmre
          extraPullNames: nix-community
          skipPush: true

      - name: cargo fmt --check
        run: nix build -L .#fmt

  # Clippy with -D warnings (reuses the cached dep layer). Linux here; the
  # macOS leg runs inside the single `macos` job below.
  clippy:
    name: Clippy (ubuntu-latest)
    needs: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2

      # Pull-only (see format-check).
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: zmre
          extraPullNames: nix-community
          skipPush: true

      - name: Clippy
        run: nix build -L .#clippy

  # Full workspace test suite (cargo test). Linux here; the macOS leg runs
  # inside the single `macos` job below.
  #
  # Also the job that pushes the LINUX ci-profile deps layer to Cachix
  # (`.#cargoArtifactsCi`, which `clippy` reuses too). The release-profile
  # layer that `build` and `e2e` reuse is pushed by `build`.
  tests:
    name: Tests (ubuntu-latest)
    needs: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2

      # Pull-only daemon (see format-check); the deps-layer push below is
      # explicit.
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: zmre
          # Absent on forks / before the user sets the secret: pushes are then
          # skipped, but pulls still work. Never fails the job when empty.
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          skipPush: true

      - name: Tests
        run: nix build -L .#tests

      # The shell's CSP against the REAL SvelteKit shell. `.#tests` embeds the
      # script-less placeholder, so it cannot see a SvelteKit release that emits
      # a script the policy does not hash (a blank window, nothing red). This
      # runs tests/spa_shell_csp.rs with `spaBuild` embedded and
      # LEDGELINE_REQUIRE_REAL_SPA=1, under which a placeholder FAILS. Here, not
      # in `build`, because it is a `ci`-profile test on `.#cargoArtifactsCi`
      # like `.#tests`: in `build` it would pull (or rebuild) a second deps
      # layer. The browser-level twin is the e2e job's csp.same-origin spec.
      - name: CSP vs. the real SPA shell
        run: nix build -L --no-link .#spaShellCsp

      # The same for Ledgeline Invoicer's shell (`app::spa_shell_csp_tests`,
      # the same oracle) with `invoicerSpaBuild` embedded. Same ci layer, so it
      # adds the invoicer SPA's vite build and one test binary, not a deps build.
      - name: CSP vs. the real invoicer SPA shell
        run: nix build -L --no-link .#invoicerSpaShellCsp

      # The crane dependency layer is the multi-GB, 45+ minute part of every
      # cold build, and the ONLY thing whose cache hit changes how long CI
      # takes. Pushed on PRs too, deliberately: a Cargo.lock bump lands on a PR
      # first, and that PR's runs are exactly the cold ones.
      #
      # `!cancelled()`, not the default `success()`: the layer is built before
      # a single test runs, so a red test run still produced it and the next
      # push should not have to rebuild it. `nix path-info` checks the LOCAL
      # store only, so if the layer itself failed to build this skips rather
      # than kicking off a second attempt at the very build that just failed.
      #
      # Not pinned (see the pin step in `build`): LRU evicting a stale deps
      # layer is the cache doing its job.
      - name: Push deps layer to Cachix
        if: ${{ !cancelled() }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "No CACHIX_AUTH_TOKEN (fork or unset) — skipping cache push."
            exit 0
          fi
          deps=$(nix eval --raw .#cargoArtifactsCi.outPath)
          if ! nix path-info "$deps" >/dev/null 2>&1; then
            echo "Deps layer $deps was not built in this job — nothing to push."
            exit 0
          fi
          cachix push zmre "$deps"

  # Build the Linux distributable — proves the GUI deps resolve (webkitgtk)
  # and that what a Linux user installs builds. Linux only: the macOS
  # equivalent (system WebKit, `.#macDist`) is part of the `macos` job.
  #
  # The placeholder-SPA `.#ledgeline` is NOT built here (nor in `macos`): it is
  # a separate derivation from `ledgelineWithSpa` (different preBuild), so it
  # cost a whole second release-profile LTO compile to prove what linuxDist
  # already proves, and no user or job consumes it. `nix flake check` still
  # has it.
  build:
    name: Build (ubuntu-latest)
    needs: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2

      # Pull-only daemon (see format-check); the release-artifact push below is
      # explicit.
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          skipPush: true

      # `.#ledgeline` is NOT what a Linux user ends up with. On Linux
      # `packages.default` AND `apps.default` are both `linuxDist` — the
      # real-SPA binary wrapped with the Mesa/EGL vendor paths, plus the
      # .desktop entry, the MIME type and the hicolor icons. So
      # `nix build github:zmre/ledgeline`, `nix profile install` and `nix run`
      # all resolve here, and NONE of it was built by CI until this step
      # existed: naming `.#ledgeline` explicitly routes around `default`. (The
      # macOS mirror is `.#macDist` in the `macos` job.)
      #
      # That gap is not theoretical. `spaNodeModules`' outputHash is per-system
      # and can only be generated ON the system it describes, so the x86_64-linux
      # entry silently went stale the moment the JS toolchain was bumped on a
      # Mac — and nothing here noticed, because nothing here built the
      # derivation. This step is what makes that a red CI run with the correct
      # hash in the log instead of a broken `nix profile install` for a user.
      #
      # It also covers `desktop-file-validate`, the MIME XML and the six icon
      # sizes, none of which any other job touches. linuxDist also installs
      # Ledgeline Invoicer (`invoicerWithSpa`, its icons and desktop entry), so
      # this is also the Linux build of the invoicer.
      #
      # NOT free: a full release-profile Rust compile of ledgelineWithSpa, plus
      # the invoicer's (on `.#cargoArtifactsInvoicer`, chained on the release
      # layer), two
      # vite builds, and pkgs.mesa's ~1 GiB closure. All cached after the first
      # green run — see the Cachix pin below, which is what keeps it that way.
      - name: Build linuxDist (Linux distributable)
        run: nix build -L --no-link .#linuxDist

      # The Linux release-profile deps layer (`.#cargoArtifacts`, reused by
      # `.#ledgelineWithSpa` and so `e2e`), and the invoicer's
      # (`.#cargoArtifactsInvoicer`, for linuxDist's invoicer). Pushed here
      # because `tests` now builds only the ci-profile layer. Same rules as the
      # push in `tests`: PRs too, `!cancelled()`, local-store guard, not pinned.
      - name: Push deps layer to Cachix
        if: ${{ !cancelled() }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "No CACHIX_AUTH_TOKEN (fork or unset) — skipping cache push."
            exit 0
          fi
          for attr in cargoArtifacts cargoArtifactsCi cargoArtifactsInvoicer; do
            deps=$(nix eval --raw ".#$attr.outPath")
            if ! nix path-info "$deps" >/dev/null 2>&1; then
              echo "Deps layer $deps was not built in this job — nothing to push."
              continue
            fi
            cachix push zmre "$deps"
          done

      # Push the user-facing store paths to our Cachix cache. Only on pushes
      # (not PRs); the in-script guard skips cleanly when the token is absent
      # (forks / before the user sets the secret), so the job never fails.
      #
      # This is deliberate and separate from the deps-layer push in `tests`:
      # it is what lets `nix build github:zmre/ledgeline` substitute instead of
      # compiling. With the action's daemon now pull-only, THIS step is the
      # only thing that uploads these paths, so do not drop it.
      - name: Push to Cachix
        if: github.event_name == 'push'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "No CACHIX_AUTH_TOKEN (fork or unset) — skipping cache push."
            exit 0
          fi
          # `linuxDist` is `packages.default`, so it is the path a user
          # actually substitutes; `ledgelineWithSpa` is listed alongside it
          # because linuxDist WRAPS that binary (makeBinaryWrapper references it
          # by store path, so it IS in the closure — but naming it explicitly
          # keeps the pin below honest and costs nothing).
          attrs=(.#linuxDist .#ledgelineWithSpa)
          nix build --json "${attrs[@]}" | jq -r '.[].outputs | to_entries[].value' | cachix push zmre

      # PIN the consumer-facing outputs. The `zmre` cache is on the 5 GB free
      # plan, which garbage-collects least-recently-USED — and LRU is exactly
      # backwards for us: the crane dependency layer gets touched by every CI
      # run so it stays warm, while the release artifact nobody has downloaded
      # since the last push is first against the wall. That is how a path CI
      # itself pulled on 2026-07-31 was already a 404 four days later.
      #
      # Pinned paths are exempt from GC, so pin the handful of things a USER
      # resolves to and let everything else be reclaimed. The dependency layer
      # is deliberately NOT pinned: it is multi-GB, it changes with every
      # Cargo.lock bump, and it is precisely what LRU *should* be evicting.
      #
      # --keep-revisions 2 keeps the previous commit's paths alive alongside the
      # current ones, so someone who evaluated a moment ago still gets a hit.
      # The darwin twin of this step is in the `macos` job.
      - name: Pin release artifacts (exempt from Cachix GC)
        if: github.event_name == 'push'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "No CACHIX_AUTH_TOKEN (fork or unset) — skipping pins."
            exit 0
          fi
          # Derive the system rather than hardcoding it, so this keeps working
          # if GitHub's runner architectures change under us.
          sys=$(nix eval --raw --impure --expr builtins.currentSystem)
          # Pin names are the STABLE identity of "the current release artifact
          # for this system"; Cachix keeps --keep-revisions of each. They are
          # prefixed with the project name because this cache is shared with
          # mbr-markdown-browser.
          #
          # `linuxDist`, not `.#ledgeline`: pin what `packages.default`
          # resolves to, which is what an unpinned `nix profile install`
          # fetches. Pinning the placeholder-SPA build instead would keep the
          # one artifact no user ever asks for alive while the real one is
          # evicted.
          cachix pin zmre "ledgeline-linuxdist-$sys" \
            "$(nix build --no-link --print-out-paths .#linuxDist)" --keep-revisions 2
          cachix pin zmre "ledgeline-cli-$sys" \
            "$(nix build --no-link --print-out-paths .#ledgelineWithSpa)" --keep-revisions 2

  # EVERYTHING macOS, in ONE job: what used to be the macOS legs of `clippy`,
  # `tests` and `build`.
  #
  # Why one job: GitHub's free macOS runners are slow (arm64 = an M1 with 3
  # CPUs and 7 GB), and three separate macOS VMs each had to fetch — or, when
  # Cachix had evicted it, REBUILD — the same crane dependency layer, which
  # cost 45–107 minutes apiece. In one `nix build` invocation the deps layer
  # is built or substituted exactly once and Nix schedules the five
  # downstream derivations in parallel on top of it. It also means one runner
  # to acquire instead of three; macOS runs were sometimes cancelled before
  # any step ran because GitHub could not find one (ci-rerun.yml retries
  # those).
  #
  # `macos-15`, not `macos-latest`: pinned so a GitHub image bump (new Xcode
  # SDK, new default arch) is a deliberate edit here rather than a surprise
  # red run — and so the cache-nix-action key below, which includes the
  # runner's OS/arch, is not silently invalidated by a relabel.
  macos:
    name: macOS (tests + clippy + build)
    needs: format-check
    runs-on: macos-15
    # `actions: write` is for cache-nix-action's PURGE of superseded store
    # caches (the GitHub API's cache-delete endpoint requires it). Job-level so
    # every other job keeps the workflow's read-only token.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2

      # SECOND-TIER cache: a whole /nix/store snapshot in the GitHub Actions
      # cache, restored before anything is built. Cachix stays the first tier
      # (shared, path-granular, what users substitute from), but its 5 GB free
      # plan is LRU and shared with mbr, so the multi-GB darwin deps layer is
      # routinely gone by the next run — and a cold deps build on this runner
      # is most of an hour. This snapshot lives in the repo's own 10 GB Actions
      # cache, which nothing else competes for.
      #
      # Must come AFTER Nix is installed (it merges the restored store DB into
      # the daemon's). The key changes whenever the deps layers can: the
      # dependency graph (flake.lock: toolchain, nixpkgs, crane; Cargo.lock)
      # AND how the layers are built (flake.nix: the layers' cargo commands,
      # features, profiles; every Cargo.toml: profiles, features, members).
      # The key must cover the latter too, because on a primary-key HIT the
      # action does not save ("Cache hit occurred on the primary-key … Not
      # saving a new cache"): with a lockfile-only key, a flake.nix/Cargo.toml
      # change that rebuilds the layers left the snapshot frozen with the old
      # ones and every later run rebuilt them cold (PR #103). flake.nix churns
      # (~1 in 6 main commits) but a re-save is ~2-3 min in the post step on
      # main; a cold darwin layer is ~20 min on every run, PRs included. On a
      # miss, `restore-prefixes-first-match` falls back to the newest snapshot
      # for this OS/arch, which still holds most of what is needed.
      #
      # Only pushes to main SAVE. Actions caches are ref-scoped, but a PR can
      # restore its base branch's entries, so every PR gets main's snapshot
      # without writing ~GBs of its own (which would blow the 10 GB budget and
      # LRU-evict main's). PURGE is gated the same way: after main saves a new
      # key, every older `nix-<os>-<arch>-` entry on main is deleted
      # (`purge-created: 0` = anything created before this job's post step;
      # `purge-primary-key: never` spares the one just saved). PR refs never
      # save, so there is nothing for them to purge — and a fork PR's token
      # could not delete anyway.
      #
      # `gc-max-store-size-macos`: before saving, GC the store down to ~8 GiB
      # so the snapshot fits the Actions budget. GC only removes UNROOTED
      # paths, and the build below uses `--no-link`, so the deps layer is
      # given an explicit GC root right after it (see "Root the deps layer").
      - name: Restore Nix store (GitHub Actions cache)
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'Cargo.lock', '**/Cargo.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          gc-max-store-size-macos: 8G
          purge: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never

      # Pull-only daemon (see format-check); the deps-layer and
      # release-artifact pushes below are explicit.
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          skipPush: true

      # ONE invocation, so the deps layer is realised once and the rest build
      # in parallel on top of it:
      #   * `.#tests`, `.#clippy` — the old macOS `tests` / `clippy` legs.
      #   * `.#macDist` — proves the GUI deps resolve against system WebKit,
      #     and is what a Mac user ends up with (`.#ledgeline`, the placeholder-SPA
      #     binary, is not, and is not built here: see `build`).
      #     On darwin `packages.default` is `macDist` (Ledgeline.app + a
      #     `bin/ledgeline` symlink into it, with the REAL SvelteKit SPA
      #     embedded), reached via spaNodeModules → spaBuild →
      #     ledgelineWithSpa → macApp → macDist. None of that chain is
      #     reachable from `.#ledgeline`, so without it
      #     `nix build github:zmre/ledgeline` / `nix profile install` on a Mac
      #     recompiles all of it even with our cache configured.
      #   * `.#spaShellCsp` — the shell's CSP against the REAL SvelteKit shell
      #     (see the same step in `build` for why); `spaBuild` is already in
      #     the store from `macDist`.
      #   * `.#invoicerMacApp` — Ledgeline Invoicer.app, what the release's
      #     invoicer leg signs (invoicer PLAN 6a): the invoicer SPA, the
      #     `invoicerWithSpa` binary on `.#cargoArtifactsInvoicer` (chained on
      #     the release layer, so only the invoicer's extra crates compile),
      #     the icns and the de-nixing checks. Without it the first build of
      #     the bundle would be a release tag.
      #   * `.#invoicerSpaShellCsp` — the invoicer's shell CSP, on the ci layer
      #     like `.#spaShellCsp`; `invoicerSpaBuild` is shared with the app.
      #
      # `--keep-going` so one red check does not hide another: as three jobs, a
      # failing test still let clippy report; without it Nix stops scheduling
      # new builds at the first failure.
      - name: Tests, clippy, build (one nix build)
        run: nix build -L --no-link --keep-going .#tests .#clippy .#macDist .#spaShellCsp .#invoicerMacApp .#invoicerSpaShellCsp

      # GC root for the deps layer, so cache-nix-action's pre-save GC (above)
      # keeps the one path that makes the next run fast. An indirect root: the
      # out-link lives in the workspace, which survives until the post steps.
      # Same `!cancelled()` + local-store guard as the push below.
      # All three layers: release (`.#cargoArtifacts`, for macDist),
      # ci profile (`.#cargoArtifactsCi`, for tests/clippy/spaShellCsp and
      # invoicerSpaShellCsp) and the invoicer's release delta
      # (`.#cargoArtifactsInvoicer`, for invoicerMacApp).
      - name: Root the deps layers (for the store cache)
        if: ${{ !cancelled() }}
        run: |
          for attr in cargoArtifacts cargoArtifactsCi cargoArtifactsInvoicer; do
            deps=$(nix eval --raw ".#$attr.outPath")
            if ! nix path-info "$deps" >/dev/null 2>&1; then
              echo "Deps layer $deps was not built in this job — nothing to root."
              continue
            fi
            nix build --out-link "$GITHUB_WORKSPACE/.ci-gcroots/$attr" ".#$attr"
          done

      # The darwin deps layers — see the same step in `tests` for why they are
      # pushed on PRs too, why `!cancelled()`, and why they are not pinned.
      - name: Push deps layers to Cachix
        if: ${{ !cancelled() }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "No CACHIX_AUTH_TOKEN (fork or unset) — skipping cache push."
            exit 0
          fi
          # Every layer, like `build`. Pushing only the release one left the
          # darwin ci layer (what tests/clippy/spaShellCsp reuse) off Cachix,
          # so every macOS run rebuilt it.
          for attr in cargoArtifacts cargoArtifactsCi cargoArtifactsInvoicer; do
            deps=$(nix eval --raw ".#$attr.outPath")
            if ! nix path-info "$deps" >/dev/null 2>&1; then
              echo "Deps layer $deps was not built in this job — nothing to push."
              continue
            fi
            cachix push zmre "$deps"
          done

      # The darwin twin of `build`'s "Push to Cachix": the user-facing paths,
      # on pushes only, guarded the same way.
      - name: Push to Cachix
        if: github.event_name == 'push'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "No CACHIX_AUTH_TOKEN (fork or unset) — skipping cache push."
            exit 0
          fi
          # The darwin-only attrs are guarded by `lib.optionalAttrs
          # stdenv.isDarwin` in flake.nix, which is why they live in this job.
          # `ledgelineWithSpa` and `bundledHledger` are listed SEPARATELY from
          # `macDist` for the SAME reason: macApp `cp`s both binaries into the
          # bundle rather than symlinking them, so neither store path is in
          # macDist's closure and neither would ride along. `ledgelineWithSpa`
          # is additionally what `nix run` resolves to on darwin;
          # `bundledHledger` is a 53 MiB download from github.com that we would
          # otherwise re-fetch on every build that cannot substitute macApp.
          # `invoicerMacApp` and `invoicerWithSpa` likewise (the bundle copies
          # the binary), so `nix build github:zmre/ledgeline#invoicerMacApp`
          # substitutes too; neither is pinned.
          attrs=(.#macDist .#ledgelineWithSpa .#bundledHledger .#invoicerMacApp .#invoicerWithSpa)
          nix build --json "${attrs[@]}" | jq -r '.[].outputs | to_entries[].value' | cachix push zmre

      # The darwin twin of `build`'s pin step — see there for why pins exist
      # at all (LRU vs. release artifacts) and why the deps layer is not one.
      - name: Pin release artifacts (exempt from Cachix GC)
        if: github.event_name == 'push'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "No CACHIX_AUTH_TOKEN (fork or unset) — skipping pins."
            exit 0
          fi
          # Derived, not hardcoded, as in `build`; prefixed with the project
          # name because this cache is shared with mbr-markdown-browser.
          sys=$(nix eval --raw --impure --expr builtins.currentSystem)
          cachix pin zmre "ledgeline-macdist-$sys" \
            "$(nix build --no-link --print-out-paths .#macDist)" --keep-revisions 2
          cachix pin zmre "ledgeline-cli-$sys" \
            "$(nix build --no-link --print-out-paths .#ledgelineWithSpa)" --keep-revisions 2

  # TypeScript / SvelteKit side: build the SPA and run its unit + type checks.
  # This job deliberately runs vitest with NO live engine, which is what proves
  # the suite is self-contained. The `e2e` job below re-runs it against a real
  # server to un-skip the round-trip contract suites.
  #
  # `test:unit` runs BOTH vitest projects: `unit` (node, pure functions) and
  # `components` (jsdom, mounted `*.svelte.test.ts`). Neither needs an engine or
  # a browser, so both belong in this job and not in `e2e`.
  spa:
    name: SPA (build + unit + check + lint)
    runs-on: ubuntu-latest
    env:
      # Runners are UTC while the developer is America/Denver, so a date bug
      # could only ever surface on one of the two. Pin CI to the developer's
      # zone (vite.config.ts pins vitest's own TZ to match).
      TZ: America/Denver
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to flake.lock's nixpkgs bun, which builds the shipped SPA
      # (`spaNodeModules`) and runs `just pre-push`. Unpinned, this floats to
      # the newest bun, whose lockfile handling can differ: a red job, or a
      # different tree from the one the DMG embeds, on a commit that changed
      # nothing. Bump it with nixpkgs: `nix develop -c bun --version`.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SPA
        run: bun run build

      - name: Unit tests (vitest)
        run: bun run test:unit

      - name: Type check (svelte-check + tsc)
        run: bun run check

      # prettier --check + eslint. Gated here, not only by pre-push: quality
      # is a release criterion (invoicer/PLAN.md I20).
      - name: Lint (prettier + eslint)
        run: bun run lint

      # The shared UI package (themes, scale, generic components, API token
      # base, native bridge). web/'s build and suite compile it, but its own
      # tests and its svelte-check run here: svelte-check only reports on the
      # directory it is pointed at.
      - name: UI package unit tests (vitest)
        working-directory: packages/ui
        run: bun run test:unit

      - name: UI package type check (svelte-check + tsc)
        working-directory: packages/ui
        run: bun run check

      - name: UI package lint (prettier + eslint)
        working-directory: packages/ui
        run: bun run lint

      # Ledgeline Invoicer's SPA (invoicer/web), in the same bun workspace.
      # Not in `e2e`: it has no Playwright suite yet.
      - name: Invoicer SPA build
        working-directory: invoicer/web
        run: bun run build

      - name: Invoicer SPA unit tests (vitest)
        working-directory: invoicer/web
        run: bun run test:unit

      - name: Invoicer SPA type check (svelte-check + tsc)
        working-directory: invoicer/web
        run: bun run check

      - name: Invoicer SPA lint (prettier + eslint)
        working-directory: invoicer/web
        run: bun run lint

  # The two suites that need a REAL engine behind the SPA, sharing one build of
  # the binary:
  #   * the round-trip contract tests (vitest, `describe.runIf(LEDGELINE_API_URL)`)
  #   * the Playwright e2e specs, which assert hledger-verified fixture numbers
  #     and are the only guard against wire drift between the engine and the SPA.
  e2e:
    name: E2E + API contract
    needs: format-check
    runs-on: ubuntu-latest
    env:
      TZ: America/Denver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2

      # Pull-only (see format-check).
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: zmre
          extraPullNames: nix-community
          skipPush: true

      # Nix, not `cargo build`, so this reuses the same store paths (and Cachix
      # hits) as the `build` job instead of maintaining a second toolchain and
      # target dir. `--server` is headless — the GUI stack is linked in but never
      # initialised — so no display is needed.
      #
      # `ledgelineWithSpa`, NOT `ledgeline`: the latter embeds the placeholder
      # SPA, and csp.same-origin.e2e.ts loads the app from the engine itself to
      # prove the shipped shell boots under its own CSP. This is the same
      # derivation `linuxDist` wraps, so the `build` job pushes and pins it.
      - name: Build ledgeline (real SPA embedded)
        run: nix build -L .#ledgelineWithSpa

      # Same pin as the `spa` job's, for the same reason.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # playwright.config.ts declares no `projects`, so the suite runs on the
      # default browser (chromium) — the only one worth downloading.
      - name: Install Playwright chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium

      # These suites are `describe.runIf(process.env.LEDGELINE_API_URL)`: with no
      # engine they report as SKIPPED rather than failing, so the URL must
      # actually be set or they are silently worthless. Poll /version for
      # readiness and kill the server on any exit path.
      - name: Contract tests vs. a live engine (vitest)
        working-directory: web
        env:
          # PINNED, not the random per-process token the engine prints at
          # startup: the readiness probe and the vitest suite both have to know
          # it. Every wire and /api route is token-gated, so an unauthenticated
          # probe gets a 401 and `curl -fsS` exits 22. This server only ever
          # sees fixtures/sample.journal on loopback inside the runner.
          LEDGELINE_TOKEN: ledgeline-ci-contract-token
          # The contract suite PATCHes /api/ui-prefs, which otherwise saves to
          # the global ui-prefs.toml in the config dir (plan 38 WP-5); browser
          # mode reads and writes no settings file.
          LEDGELINE_UI_PREFS_IN_BROWSER: "1"
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/result/bin/ledgeline" \
            --server "$GITHUB_WORKSPACE/fixtures/sample.journal" --port 5055 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          auth=(-H "Authorization: Bearer $LEDGELINE_TOKEN")
          for _ in $(seq 1 60); do
            curl -fsS "${auth[@]}" http://127.0.0.1:5055/version >/dev/null 2>&1 && break
            sleep 0.5
          done
          # Fails the step (and prints why) if the engine never came up OR the
          # token is wrong — better here than as a wall of 401s inside vitest.
          curl -fsS "${auth[@]}" http://127.0.0.1:5055/version
          LEDGELINE_API_URL=http://127.0.0.1:5055 bun run test:unit

      # Playwright starts its own two servers (the engine on :5099 and `bun run
      # preview` on :4173). LEDGELINE_BIN points the first at the Nix binary,
      # since CI has no cargo target dir for the config's default path.
      # REQUIRE_REAL_SPA=1 turns csp.same-origin's local "placeholder → skip"
      # into a failure: here the engine MUST be serving the real shell.
      - name: E2E (Playwright)
        working-directory: web
        env:
          LEDGELINE_BIN: ${{ github.workspace }}/result/bin/ledgeline
          REQUIRE_REAL_SPA: "1"
        run: bun run test:e2e

      # playwright.config.ts sets no `reporter`, so there is no playwright-report/
      # to collect — but a failing spec still drops its error context (page
      # snapshot, console) under test-results/, which is what makes a red headless
      # run debuggable after the fact.
      - name: Upload Playwright failure context
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Advisory scans of Cargo.lock and bun.lock. Defined in audit.yml so the
  # same two jobs also run on a daily schedule — see there for why. The ignore
  # lists live in scripts/audit.sh.
  audit:
    uses: ./.github/workflows/audit.yml
    secrets: inherit
