name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The version lives in four places (see scripts/release.sh for why each one
  # exists and how each drifts). Three of them fail SILENTLY: a stale
  # `ledgeline-core` dependency version only breaks `cargo publish`, at the very
  # end of a release; a stale `web/package.json` breaks nothing at all and had
  # already drifted to 0.0.1 against a 0.1.0 workspace before this job existed.
  # Pure bash and no Nix, so it costs seconds and gates nothing else.
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: scripts/release.sh check
        run: ./scripts/release.sh check

  # Fast, cheap gate — runs first and fails early on formatting.
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Setup Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: zmre
          # Absent on forks / before the user sets the secret: pushes are then
          # skipped, but pulls still work. Never fails the job when empty.
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          # Don't burn cache quota on source trees (see docs/development.md).
          pushFilter: '-(source|vendor)$'

      - name: cargo fmt --check
        run: nix build -L .#fmt

  # Clippy with -D warnings, on both platforms (reuses the cached dep layer).
  clippy:
    name: Clippy (${{ matrix.os }})
    needs: format-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Setup Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          # Don't burn cache quota on source trees (see docs/development.md).
          pushFilter: '-(source|vendor)$'

      - name: Clippy
        run: nix build -L .#clippy

  # Full workspace test suite (cargo test) on both platforms.
  tests:
    name: Tests (${{ matrix.os }})
    needs: format-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Setup Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          # Don't burn cache quota on source trees (see docs/development.md).
          pushFilter: '-(source|vendor)$'

      - name: Tests
        run: nix build -L .#tests

  # Build the single binary — proves the GUI deps resolve (webkitgtk on Linux,
  # system WebKit on macOS). Embeds a placeholder SPA (see docs/development.md).
  # On macOS this ALSO builds the real distributable (`.#macDist`), because that
  # — not `.#ledgeline` — is what a Mac user's `nix build` resolves to.
  build:
    name: Build (${{ matrix.os }})
    needs: format-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Setup Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          # Don't burn cache quota on source trees (see docs/development.md).
          pushFilter: '-(source|vendor)$'

      - name: Build ledgeline
        run: nix build -L .#ledgeline

      # `.#ledgeline` is NOT what a Mac user ends up with. On darwin
      # `packages.default` is `macDist` (Ledgeline.app + a `bin/ledgeline`
      # symlink into it, with the REAL SvelteKit SPA embedded), reached via
      # spaNodeModules → spaBuild → ledgelineWithSpa → macApp → macDist. None of
      # that chain is reachable from `.#ledgeline`, so without this step
      # `nix build github:zmre/ledgeline` / `nix profile install` on a Mac
      # recompiles all of it even with our cache configured. `--no-link` leaves
      # `result` pointing at `.#ledgeline`.
      - name: Build Ledgeline.app (macOS distributable)
        if: runner.os == 'macOS'
        run: nix build -L --no-link .#macDist

      # The Linux mirror of the step above, and for the same reason: `.#ledgeline`
      # is NOT what a Linux user ends up with either. On Linux `packages.default`
      # AND `apps.default` are both `linuxDist` — the real-SPA binary wrapped
      # with the Mesa/EGL vendor paths, plus the .desktop entry, the MIME type
      # and the hicolor icons. So `nix build github:zmre/ledgeline`,
      # `nix profile install` and `nix run` all resolve here, and NONE of it was
      # built by CI until now: naming `.#ledgeline` explicitly routes around
      # `default`.
      #
      # That gap is not theoretical. `spaNodeModules`' outputHash is per-system
      # and can only be generated ON the system it describes, so the x86_64-linux
      # entry silently went stale the moment the JS toolchain was bumped on a
      # Mac — and nothing here noticed, because nothing here built the
      # derivation. This step is what makes that a red CI run with the correct
      # hash in the log instead of a broken `nix profile install` for a user.
      #
      # It also covers `desktop-file-validate`, the MIME XML and the six icon
      # sizes, none of which any other job touches.
      #
      # NOT free: this is a second full Rust compile (ledgelineWithSpa shares no
      # artifacts with the placeholder-SPA `.#ledgeline`), a bun install + vite
      # build, and pkgs.mesa's ~1 GiB closure. All cached after the first green
      # run — see the Cachix pin below, which is what keeps it that way.
      - name: Build linuxDist (Linux distributable)
        if: runner.os == 'Linux'
        run: nix build -L --no-link .#linuxDist

      # Push the freshly built store paths to our Cachix cache. Only on pushes
      # (not PRs); the in-script guard skips cleanly when the token is absent
      # (forks / before the user sets the secret), so the job never fails.
      - name: Push to Cachix
        if: github.event_name == 'push'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "No CACHIX_AUTH_TOKEN (fork or unset) — skipping cache push."
            exit 0
          fi
          # The darwin-only attrs are guarded by `lib.optionalAttrs
          # stdenv.isDarwin` in flake.nix, so only ask for them there.
          # `ledgelineWithSpa` and `bundledHledger` are listed SEPARATELY from
          # `macDist` for the SAME reason: macApp `cp`s both binaries into the
          # bundle rather than symlinking them, so neither store path is in
          # macDist's closure and neither would ride along. `ledgelineWithSpa`
          # is additionally what `nix run` resolves to on darwin;
          # `bundledHledger` is a 53 MiB download from github.com that we would
          # otherwise re-fetch on every build that cannot substitute macApp.
          #
          # On Linux `linuxDist` is `packages.default`, so it is the path a user
          # actually substitutes; `ledgelineWithSpa` is listed alongside it
          # because linuxDist WRAPS that binary (makeBinaryWrapper references it
          # by store path, so it IS in the closure — but naming it explicitly
          # keeps the pin below honest and costs nothing).
          attrs=(.#ledgeline)
          if [ "$RUNNER_OS" = "macOS" ]; then
            attrs+=(.#macDist .#ledgelineWithSpa .#bundledHledger)
          else
            attrs+=(.#linuxDist .#ledgelineWithSpa)
          fi
          nix build --json "${attrs[@]}" | jq -r '.[].outputs | to_entries[].value' | cachix push zmre

      # PIN the consumer-facing outputs. The `zmre` cache is on the 5 GB free
      # plan, which garbage-collects least-recently-USED — and LRU is exactly
      # backwards for us: the crane dependency layer gets touched by every CI
      # run so it stays warm, while the release artifact nobody has downloaded
      # since the last push is first against the wall. That is how a path CI
      # itself pulled on 2026-07-31 was already a 404 four days later.
      #
      # Pinned paths are exempt from GC, so pin the handful of things a USER
      # resolves to and let everything else be reclaimed. The dependency layer
      # is deliberately NOT pinned: it is multi-GB, it changes with every
      # Cargo.lock bump, and it is precisely what LRU *should* be evicting.
      #
      # --keep-revisions 2 keeps the previous commit's paths alive alongside the
      # current ones, so someone who evaluated a moment ago still gets a hit.
      - name: Pin release artifacts (exempt from Cachix GC)
        if: github.event_name == 'push'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "No CACHIX_AUTH_TOKEN (fork or unset) — skipping pins."
            exit 0
          fi
          # Derive the system rather than hardcoding it, so this keeps working
          # if GitHub's runner architectures change under us.
          sys=$(nix eval --raw --impure --expr builtins.currentSystem)
          # Pin names are the STABLE identity of "the current release artifact
          # for this system"; Cachix keeps --keep-revisions of each. They are
          # prefixed with the project name because this cache is shared with
          # mbr-markdown-browser.
          if [ "$RUNNER_OS" = "macOS" ]; then
            cachix pin zmre "ledgeline-macdist-$sys" \
              "$(nix build --no-link --print-out-paths .#macDist)" --keep-revisions 2
            cachix pin zmre "ledgeline-cli-$sys" \
              "$(nix build --no-link --print-out-paths .#ledgelineWithSpa)" --keep-revisions 2
          else
            # `linuxDist`, not `.#ledgeline`: pin what `packages.default`
            # resolves to, which is what an unpinned `nix profile install`
            # fetches. Pinning the placeholder-SPA build instead would keep the
            # one artifact no user ever asks for alive while the real one is
            # evicted.
            cachix pin zmre "ledgeline-linuxdist-$sys" \
              "$(nix build --no-link --print-out-paths .#linuxDist)" --keep-revisions 2
            cachix pin zmre "ledgeline-cli-$sys" \
              "$(nix build --no-link --print-out-paths .#ledgelineWithSpa)" --keep-revisions 2
          fi

  # TypeScript / SvelteKit side: build the SPA and run its unit + type checks.
  # This job deliberately runs vitest with NO live engine, which is what proves
  # the suite is self-contained. The `e2e` job below re-runs it against a real
  # server to un-skip the round-trip contract suites.
  #
  # `test:unit` runs BOTH vitest projects: `unit` (node, pure functions) and
  # `components` (jsdom, mounted `*.svelte.test.ts`). Neither needs an engine or
  # a browser, so both belong in this job and not in `e2e`.
  spa:
    name: SPA (build + unit + check)
    runs-on: ubuntu-latest
    env:
      # Runners are UTC while the developer is America/Denver, so a date bug
      # could only ever surface on one of the two. Pin CI to the developer's
      # zone (vite.config.ts pins vitest's own TZ to match).
      TZ: America/Denver
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SPA
        run: bun run build

      - name: Unit tests (vitest)
        run: bun run test:unit

      - name: Type check (svelte-check + tsc)
        run: bun run check

  # The two suites that need a REAL engine behind the SPA, sharing one build of
  # the binary:
  #   * the round-trip contract tests (vitest, `describe.runIf(LEDGELINE_API_URL)`)
  #   * the Playwright e2e specs, which assert hledger-verified fixture numbers
  #     and are the only guard against wire drift between the engine and the SPA.
  e2e:
    name: E2E + API contract
    needs: format-check
    runs-on: ubuntu-latest
    env:
      TZ: America/Denver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Setup Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          # Don't burn cache quota on source trees (see docs/development.md).
          pushFilter: '-(source|vendor)$'

      # Nix, not `cargo build`, so this reuses the same store paths (and Cachix
      # hits) as the `build` job instead of maintaining a second toolchain and
      # target dir. `--server` is headless — the GUI stack is linked in but never
      # initialised — so no display is needed.
      - name: Build ledgeline
        run: nix build -L .#ledgeline

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # playwright.config.ts declares no `projects`, so the suite runs on the
      # default browser (chromium) — the only one worth downloading.
      - name: Install Playwright chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium

      # These suites are `describe.runIf(process.env.LEDGELINE_API_URL)`: with no
      # engine they report as SKIPPED rather than failing, so the URL must
      # actually be set or they are silently worthless. Poll /version for
      # readiness and kill the server on any exit path.
      - name: Contract tests vs. a live engine (vitest)
        working-directory: web
        env:
          # PINNED, not the random per-process token the engine prints at
          # startup: the readiness probe and the vitest suite both have to know
          # it. Every wire and /api route is token-gated, so an unauthenticated
          # probe gets a 401 and `curl -fsS` exits 22. This server only ever
          # sees fixtures/sample.journal on loopback inside the runner.
          LEDGELINE_TOKEN: ledgeline-ci-contract-token
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/result/bin/ledgeline" \
            --server "$GITHUB_WORKSPACE/fixtures/sample.journal" --port 5055 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          auth=(-H "Authorization: Bearer $LEDGELINE_TOKEN")
          for _ in $(seq 1 60); do
            curl -fsS "${auth[@]}" http://127.0.0.1:5055/version >/dev/null 2>&1 && break
            sleep 0.5
          done
          # Fails the step (and prints why) if the engine never came up OR the
          # token is wrong — better here than as a wall of 401s inside vitest.
          curl -fsS "${auth[@]}" http://127.0.0.1:5055/version
          LEDGELINE_API_URL=http://127.0.0.1:5055 bun run test:unit

      # Playwright starts its own two servers (the engine on :5099 and `bun run
      # preview` on :4173). LEDGELINE_BIN points the first at the Nix binary,
      # since CI has no cargo target dir for the config's default path.
      - name: E2E (Playwright)
        working-directory: web
        env:
          LEDGELINE_BIN: ${{ github.workspace }}/result/bin/ledgeline
        run: bun run test:e2e

      # playwright.config.ts sets no `reporter`, so there is no playwright-report/
      # to collect — but a failing spec still drops its error context (page
      # snapshot, console) under test-results/, which is what makes a red headless
      # run debuggable after the fact.
      - name: Upload Playwright failure context
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # RUSTSEC advisory scan of Cargo.lock (SEC-14).
  #
  # Runs in the minimal `.#audit` dev shell rather than as `nix build .#audit`:
  # cargo-audit fetches the advisory DB from GitHub at run time and the Nix
  # build sandbox has no network, so this cannot be a `checks.` derivation.
  # No `needs:` — it reads only Cargo.lock, so it is independent of formatting
  # and of whether the code compiles, and a real CVE should surface even on a
  # branch that is red for other reasons.
  #
  # BLOCKING, deliberately. `cargo audit` only fails on `vulnerability`-class
  # advisories; `unmaintained` and `unsound` are reported as warnings and exit
  # 0. That is exactly the behaviour we want: the twelve gtk3-rs / glib /
  # proc-macro-error entries stay VISIBLE in the log without wedging CI (there
  # is no upstream fix to move to — wry/tao still bind GTK3), while a genuinely
  # new and actionable CVE turns this job red on the next run.
  #
  # RUSTSEC-2024-0429 (glib < 0.20, `VariantStrIter` unsoundness) is one of
  # those twelve, and it is the one Dependabot raises as a repo security alert —
  # GitHub's advisory DB ingests RustSec informational entries without the
  # unsound/vulnerability split, so it looks more urgent there than it is.
  # Investigated 2026-08-31; assessed as NOT AFFECTED, on two independent
  # grounds, both verified rather than reasoned:
  #
  #   * NO CALLER EXISTS. The only entry point is `Variant::array_iter_str()`
  #     (`VariantStrIter::new` is `pub(crate)`). Grepping the whole vendored
  #     registry for `VariantStrIter|array_iter_str` returns nothing outside
  #     glib-0.18.5 itself. tao's `Variant` is `dbus::arg::Variant`, unrelated;
  #     glib's own other uses are `g_variant_get_child_VALUE`, which is not
  #     variadic and not what the advisory is about.
  #   * NOT ON macOS AT ALL. `cargo tree -i -p glib@0.18.5 --target
  #     aarch64-apple-darwin` prints nothing; the GTK subtree is cfg-gated to
  #     Linux/BSD and appears in Cargo.lock only because lockfiles are
  #     target-agnostic.
  #
  # Note the bug is in the RUST BINDING's `unsafe` block (`&p` where `&mut p`
  # was needed), NOT in C glib — so "we link GTK3, therefore we are exposed" is
  # wrong, and is the easy mistake to make here.
  #
  # It is deliberately NOT `--ignore`d: it costs nothing to leave visible, and
  # unlike the quick-xml pair below there is no CI failure to suppress.
  #
  # WHAT WOULD MAKE THIS ACTIONABLE: any of tao / wry / muda / gtk / gdk /
  # webkit2gtk starting to iterate a string-array GVariant (XDG portal replies,
  # GSettings string lists and GTK action targets are the plausible routes).
  # That risk arrives with a dependency bump, so re-run the grep above whenever
  # wry/tao move — not on a calendar. The real fix is upstream: wry/tao
  # migrating Linux off GTK3. gtk3-rs topped out at 0.18.2 and requires
  # glib "^0.18", so no lockfile change can reach glib 0.20 — which is also why
  # Dependabot cannot open a PR for it.
  audit:
    name: Cargo audit (RUSTSEC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Setup Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          # Don't burn cache quota on source trees (see docs/development.md).
          pushFilter: '-(source|vendor)$'

      # --- Ignored advisories ---------------------------------------------
      # RUSTSEC-2026-0194 / RUSTSEC-2026-0195 — quick-xml 0.39.4, two "7.5
      # high" denial-of-service issues (quadratic duplicate-attribute scan;
      # unbounded namespace-declaration allocation).
      #
      #   WHY IGNORED — unreachable at run time AND unfixable from this repo:
      #     * The only path is
      #         quick-xml -> wayland-scanner (PROC-MACRO) -> wayland-client
      #         -> rfd -> ledgeline
      #       wayland-scanner is a build-time proc macro, so quick-xml parses
      #       the vendored wayland protocol .xml files during compilation. It
      #       never sees a journal file, an HTTP request, or any other runtime
      #       input, so neither DoS is reachable by an attacker.
      #     * rfd gates its wayland deps on cfg(target_os = "linux" | the
      #       BSDs), so the crate is absent from the macOS graph entirely —
      #       `cargo tree -i quick-xml` there reports "nothing to print". It is
      #       only in Cargo.lock because the lockfile is target-agnostic.
      #     * The advisories' fix is quick-xml >= 0.41, but wayland-scanner
      #       0.31.10 requires "^0.39". No `cargo update` can reach it.
      #
      #   WHAT WOULD MAKE THIS ACTIONABLE: a wayland-scanner release that
      #   widens its quick-xml requirement past 0.39 (or an rfd bump that drops
      #   wayland-scanner). Delete the two --ignore flags then and let the
      #   lockfile take the fix. Re-check whenever this job is touched.
      - name: cargo audit
        run: |
          nix develop -L .#audit -c cargo-audit audit \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195

  # GitHub-advisory scan of web/bun.lock — the SPA's counterpart to the Rust
  # `audit` job above.
  #
  # WHY THIS JOB HAS TO EXIST: Dependabot cannot cover the SPA. GitHub
  # classifies Bun as its own ecosystem and supports version updates but NOT
  # security updates for it, and the dependency graph only parses
  # web/package.json — 26 direct packages, against the 478 that bun.lock
  # actually resolves. Every TRANSITIVE npm dependency, which is where npm
  # vulnerabilities overwhelmingly live, was therefore invisible to alerts.
  # This job found thirteen advisories on its first run.
  #
  # Mirrors `audit`: no `needs:`, because it reads only package.json +
  # bun.lock (no node_modules, no install step), so a real advisory surfaces
  # even on a branch that is red for other reasons. Not a `checks.` derivation
  # for the same reason either — `bun audit` queries the advisory API over the
  # network and the Nix sandbox has none.
  #
  # BLOCKING. `bun audit` exits non-zero on ANY advisory at ANY severity, so
  # every currently-known one has to be listed below and anything NEW turns
  # this job red. (Verified both directions: with the nine ignores it exits 0;
  # with a bogus ignore id it still exits 1, so the flags cannot silently
  # neuter the job.)
  spa-audit:
    name: SPA audit (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Setup Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          pushFilter: '-(source|vendor)$'

      # --- Ignored advisories ---------------------------------------------
      # All nine are in build/test tooling, or in code paths Vite's browser
      # build drops. None reaches a user. Ledgeline ships ONE artifact out of
      # web/: the static bundle in web/build, embedded into the Rust binary by
      # rust-embed and served by our own axum server. There is no Node runtime
      # and no SvelteKit server — adapter-static emits only _app/, index.html,
      # robots.txt and an icon.
      #
      # Every claim below was CHECKED against the built bundle rather than
      # assumed, with `grep -r <marker> web/build/_app`.
      #
      #   postcss  GHSA-r28c-9q8g-f849 (high), GHSA-fxqj-rqcc-2cmp (moderate)
      #   nanoid   GHSA-28wg-ghj8-5hjv (high), GHSA-2v37-7h3g-55p8 (high)
      #     Reached only via `vite > postcss [> nanoid]` and
      #     `eslint-plugin-svelte > postcss` — build-time CSS tooling. Both
      #     "postcss" and "nanoid" appear in ZERO bundle files. The postcss
      #     issues are sourceMappingURL path traversal during a build, which
      #     only ever reads our own sources.
      #
      #   brace-expansion  GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895 (high)
      #     Three paths. Two are build-time (eslint, typescript-eslint). The
      #     third, `exceljs > archiver > archiver-utils > glob > minimatch`,
      #     runs through a package that DOES ship — but archiver is exceljs's
      #     Node-only zip path and Vite drops it: "archiver", "minimatch" and
      #     "braceExpand" each appear in ZERO bundle files.
      #
      #   uuid  GHSA-w5hq-g745-h8pq (moderate)
      #     `exceljs > uuid`, and exceljs does ship. The advisory requires uuid
      #     v3/v5/v6 called WITH a `buf` argument; the v3/v5 namespace
      #     constants ("DNS:") and the v4 bit-twiddling are both absent from
      #     the bundle, so the vulnerable entry points are not in it.
      #
      #   @sveltejs/kit  GHSA-29g2-3rmr-qm68 (moderate)
      #   cookie         GHSA-pxg6-pf52-xh8x (low)
      #     Both are SERVER-side: ReDoS in kit's HTTP content negotiation, and
      #     kit's cookie handling. There is no server here to negotiate with —
      #     adapter-static emits no server bundle, and "sameSite", "Max-Age"
      #     and "httpOnly" appear in ZERO bundle files.
      #
      #   WHAT WOULD MAKE THESE ACTIONABLE: there is nothing to move to today.
      #   `bun update --latest` was tried and clears only ONE of the thirteen
      #   (13 -> 12); upstream vite/kit/eslint still pin the vulnerable
      #   transitives. Re-check whenever this job is touched, and drop any
      #   --ignore whose package has since been bumped past the advisory.
      - name: bun audit
        run: |
          nix develop -L .#spaAudit -c bash -c 'cd web && bun audit \
            --ignore=GHSA-r28c-9q8g-f849 \
            --ignore=GHSA-fxqj-rqcc-2cmp \
            --ignore=GHSA-28wg-ghj8-5hjv \
            --ignore=GHSA-2v37-7h3g-55p8 \
            --ignore=GHSA-mh99-v99m-4gvg \
            --ignore=GHSA-rgw5-rvv9-x895 \
            --ignore=GHSA-w5hq-g745-h8pq \
            --ignore=GHSA-29g2-3rmr-qm68 \
            --ignore=GHSA-pxg6-pf52-xh8x'
