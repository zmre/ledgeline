name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The version lives in four places (see scripts/release.sh for why each one
  # exists and how each drifts). Three of them fail SILENTLY: a stale
  # `ledgeline-core` dependency version only breaks `cargo publish`, at the very
  # end of a release; a stale `web/package.json` breaks nothing at all and had
  # already drifted to 0.0.1 against a 0.1.0 workspace before this job existed.
  # Pure bash and no Nix, so it costs seconds and gates nothing else.
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: scripts/release.sh check
        run: ./scripts/release.sh check

  # Fast, cheap gate — runs first and fails early on formatting.
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3.23.0

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: zmre
          # Absent on forks / before the user sets the secret: pushes are then
          # skipped, but pulls still work. Never fails the job when empty.
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          # Don't burn cache quota on source trees (see docs/development.md).
          pushFilter: '-(source|vendor)$'

      - name: cargo fmt --check
        run: nix build -L .#fmt

  # Clippy with -D warnings, on both platforms (reuses the cached dep layer).
  clippy:
    name: Clippy (${{ matrix.os }})
    needs: format-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3.23.0

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          # Don't burn cache quota on source trees (see docs/development.md).
          pushFilter: '-(source|vendor)$'

      - name: Clippy
        run: nix build -L .#clippy

  # Full workspace test suite (cargo test) on both platforms.
  tests:
    name: Tests (${{ matrix.os }})
    needs: format-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3.23.0

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          # Don't burn cache quota on source trees (see docs/development.md).
          pushFilter: '-(source|vendor)$'

      - name: Tests
        run: nix build -L .#tests

  # Build the single binary — proves the GUI deps resolve (webkitgtk on Linux,
  # system WebKit on macOS). Embeds a placeholder SPA (see docs/development.md).
  # On macOS this ALSO builds the real distributable (`.#macDist`), because that
  # — not `.#ledgeline` — is what a Mac user's `nix build` resolves to.
  build:
    name: Build (${{ matrix.os }})
    needs: format-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3.23.0

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          # Don't burn cache quota on source trees (see docs/development.md).
          pushFilter: '-(source|vendor)$'

      - name: Build ledgeline
        run: nix build -L .#ledgeline

      # `.#ledgeline` is NOT what a Mac user ends up with. On darwin
      # `packages.default` is `macDist` (Ledgeline.app + a `bin/ledgeline`
      # symlink into it, with the REAL SvelteKit SPA embedded), reached via
      # spaNodeModules → spaBuild → ledgelineWithSpa → macApp → macDist. None of
      # that chain is reachable from `.#ledgeline`, so without this step
      # `nix build github:zmre/ledgeline` / `nix profile install` on a Mac
      # recompiles all of it even with our cache configured. `--no-link` leaves
      # `result` pointing at `.#ledgeline`.
      - name: Build Ledgeline.app (macOS distributable)
        if: runner.os == 'macOS'
        run: nix build -L --no-link .#macDist

      # The Linux mirror of the step above, and for the same reason: `.#ledgeline`
      # is NOT what a Linux user ends up with either. On Linux `packages.default`
      # AND `apps.default` are both `linuxDist` — the real-SPA binary wrapped
      # with the Mesa/EGL vendor paths, plus the .desktop entry, the MIME type
      # and the hicolor icons. So `nix build github:zmre/ledgeline`,
      # `nix profile install` and `nix run` all resolve here, and NONE of it was
      # built by CI until now: naming `.#ledgeline` explicitly routes around
      # `default`.
      #
      # That gap is not theoretical. `spaNodeModules`' outputHash is per-system
      # and can only be generated ON the system it describes, so the x86_64-linux
      # entry silently went stale the moment the JS toolchain was bumped on a
      # Mac — and nothing here noticed, because nothing here built the
      # derivation. This step is what makes that a red CI run with the correct
      # hash in the log instead of a broken `nix profile install` for a user.
      #
      # It also covers `desktop-file-validate`, the MIME XML and the six icon
      # sizes, none of which any other job touches.
      #
      # NOT free: this is a second full Rust compile (ledgelineWithSpa shares no
      # artifacts with the placeholder-SPA `.#ledgeline`), a bun install + vite
      # build, and pkgs.mesa's ~1 GiB closure. All cached after the first green
      # run — see the Cachix pin below, which is what keeps it that way.
      - name: Build linuxDist (Linux distributable)
        if: runner.os == 'Linux'
        run: nix build -L --no-link .#linuxDist

      # Push the freshly built store paths to our Cachix cache. Only on pushes
      # (not PRs); the in-script guard skips cleanly when the token is absent
      # (forks / before the user sets the secret), so the job never fails.
      - name: Push to Cachix
        if: github.event_name == 'push'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "No CACHIX_AUTH_TOKEN (fork or unset) — skipping cache push."
            exit 0
          fi
          # The darwin-only attrs are guarded by `lib.optionalAttrs
          # stdenv.isDarwin` in flake.nix, so only ask for them there.
          # `ledgelineWithSpa` and `bundledHledger` are listed SEPARATELY from
          # `macDist` for the SAME reason: macApp `cp`s both binaries into the
          # bundle rather than symlinking them, so neither store path is in
          # macDist's closure and neither would ride along. `ledgelineWithSpa`
          # is additionally what `nix run` resolves to on darwin;
          # `bundledHledger` is a 53 MiB download from github.com that we would
          # otherwise re-fetch on every build that cannot substitute macApp.
          #
          # On Linux `linuxDist` is `packages.default`, so it is the path a user
          # actually substitutes; `ledgelineWithSpa` is listed alongside it
          # because linuxDist WRAPS that binary (makeBinaryWrapper references it
          # by store path, so it IS in the closure — but naming it explicitly
          # keeps the pin below honest and costs nothing).
          attrs=(.#ledgeline)
          if [ "$RUNNER_OS" = "macOS" ]; then
            attrs+=(.#macDist .#ledgelineWithSpa .#bundledHledger)
          else
            attrs+=(.#linuxDist .#ledgelineWithSpa)
          fi
          nix build --json "${attrs[@]}" | jq -r '.[].outputs | to_entries[].value' | cachix push zmre

      # PIN the consumer-facing outputs. The `zmre` cache is on the 5 GB free
      # plan, which garbage-collects least-recently-USED — and LRU is exactly
      # backwards for us: the crane dependency layer gets touched by every CI
      # run so it stays warm, while the release artifact nobody has downloaded
      # since the last push is first against the wall. That is how a path CI
      # itself pulled on 2026-07-31 was already a 404 four days later.
      #
      # Pinned paths are exempt from GC, so pin the handful of things a USER
      # resolves to and let everything else be reclaimed. The dependency layer
      # is deliberately NOT pinned: it is multi-GB, it changes with every
      # Cargo.lock bump, and it is precisely what LRU *should* be evicting.
      #
      # --keep-revisions 2 keeps the previous commit's paths alive alongside the
      # current ones, so someone who evaluated a moment ago still gets a hit.
      - name: Pin release artifacts (exempt from Cachix GC)
        if: github.event_name == 'push'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "${CACHIX_AUTH_TOKEN:-}" ]; then
            echo "No CACHIX_AUTH_TOKEN (fork or unset) — skipping pins."
            exit 0
          fi
          # Derive the system rather than hardcoding it, so this keeps working
          # if GitHub's runner architectures change under us.
          sys=$(nix eval --raw --impure --expr builtins.currentSystem)
          # Pin names are the STABLE identity of "the current release artifact
          # for this system"; Cachix keeps --keep-revisions of each. They are
          # prefixed with the project name because this cache is shared with
          # mbr-markdown-browser.
          if [ "$RUNNER_OS" = "macOS" ]; then
            cachix pin zmre "ledgeline-macdist-$sys" \
              "$(nix build --no-link --print-out-paths .#macDist)" --keep-revisions 2
            cachix pin zmre "ledgeline-cli-$sys" \
              "$(nix build --no-link --print-out-paths .#ledgelineWithSpa)" --keep-revisions 2
          else
            # `linuxDist`, not `.#ledgeline`: pin what `packages.default`
            # resolves to, which is what an unpinned `nix profile install`
            # fetches. Pinning the placeholder-SPA build instead would keep the
            # one artifact no user ever asks for alive while the real one is
            # evicted.
            cachix pin zmre "ledgeline-linuxdist-$sys" \
              "$(nix build --no-link --print-out-paths .#linuxDist)" --keep-revisions 2
            cachix pin zmre "ledgeline-cli-$sys" \
              "$(nix build --no-link --print-out-paths .#ledgelineWithSpa)" --keep-revisions 2
          fi

  # TypeScript / SvelteKit side: build the SPA and run its unit + type checks.
  # This job deliberately runs vitest with NO live engine, which is what proves
  # the suite is self-contained. The `e2e` job below re-runs it against a real
  # server to un-skip the round-trip contract suites.
  #
  # `test:unit` runs BOTH vitest projects: `unit` (node, pure functions) and
  # `components` (jsdom, mounted `*.svelte.test.ts`). Neither needs an engine or
  # a browser, so both belong in this job and not in `e2e`.
  spa:
    name: SPA (build + unit + check)
    runs-on: ubuntu-latest
    env:
      # Runners are UTC while the developer is America/Denver, so a date bug
      # could only ever surface on one of the two. Pin CI to the developer's
      # zone (vite.config.ts pins vitest's own TZ to match).
      TZ: America/Denver
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SPA
        run: bun run build

      - name: Unit tests (vitest)
        run: bun run test:unit

      - name: Type check (svelte-check + tsc)
        run: bun run check

  # The two suites that need a REAL engine behind the SPA, sharing one build of
  # the binary:
  #   * the round-trip contract tests (vitest, `describe.runIf(LEDGELINE_API_URL)`)
  #   * the Playwright e2e specs, which assert hledger-verified fixture numbers
  #     and are the only guard against wire drift between the engine and the SPA.
  e2e:
    name: E2E + API contract
    needs: format-check
    runs-on: ubuntu-latest
    env:
      TZ: America/Denver
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3.23.0

      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: zmre
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
          # Don't burn cache quota on source trees (see docs/development.md).
          pushFilter: '-(source|vendor)$'

      # Nix, not `cargo build`, so this reuses the same store paths (and Cachix
      # hits) as the `build` job instead of maintaining a second toolchain and
      # target dir. `--server` is headless — the GUI stack is linked in but never
      # initialised — so no display is needed.
      - name: Build ledgeline
        run: nix build -L .#ledgeline

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # playwright.config.ts declares no `projects`, so the suite runs on the
      # default browser (chromium) — the only one worth downloading.
      - name: Install Playwright chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium

      # These suites are `describe.runIf(process.env.LEDGELINE_API_URL)`: with no
      # engine they report as SKIPPED rather than failing, so the URL must
      # actually be set or they are silently worthless. Poll /version for
      # readiness and kill the server on any exit path.
      - name: Contract tests vs. a live engine (vitest)
        working-directory: web
        env:
          # PINNED, not the random per-process token the engine prints at
          # startup: the readiness probe and the vitest suite both have to know
          # it. Every wire and /api route is token-gated, so an unauthenticated
          # probe gets a 401 and `curl -fsS` exits 22. This server only ever
          # sees fixtures/sample.journal on loopback inside the runner.
          LEDGELINE_TOKEN: ledgeline-ci-contract-token
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/result/bin/ledgeline" \
            --server "$GITHUB_WORKSPACE/fixtures/sample.journal" --port 5055 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          auth=(-H "Authorization: Bearer $LEDGELINE_TOKEN")
          for _ in $(seq 1 60); do
            curl -fsS "${auth[@]}" http://127.0.0.1:5055/version >/dev/null 2>&1 && break
            sleep 0.5
          done
          # Fails the step (and prints why) if the engine never came up OR the
          # token is wrong — better here than as a wall of 401s inside vitest.
          curl -fsS "${auth[@]}" http://127.0.0.1:5055/version
          LEDGELINE_API_URL=http://127.0.0.1:5055 bun run test:unit

      # Playwright starts its own two servers (the engine on :5099 and `bun run
      # preview` on :4173). LEDGELINE_BIN points the first at the Nix binary,
      # since CI has no cargo target dir for the config's default path.
      - name: E2E (Playwright)
        working-directory: web
        env:
          LEDGELINE_BIN: ${{ github.workspace }}/result/bin/ledgeline
        run: bun run test:e2e

      # playwright.config.ts sets no `reporter`, so there is no playwright-report/
      # to collect — but a failing spec still drops its error context (page
      # snapshot, console) under test-results/, which is what makes a red headless
      # run debuggable after the fact.
      - name: Upload Playwright failure context
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Advisory scans of Cargo.lock and web/bun.lock. Defined in audit.yml so the
  # same two jobs also run on a daily schedule — see there for why. The ignore
  # lists live in scripts/audit.sh.
  audit:
    uses: ./.github/workflows/audit.yml
    secrets: inherit
