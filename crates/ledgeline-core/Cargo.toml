[package]
name = "ledgeline-core"
description = "Ledgeline journal engine: hledger journal parser, exact-decimal model, reports."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["hledger", "accounting", "ledger", "finance"]
categories = ["parser-implementations", "finance"]
# `benches/` is included because `[[bench]]` below names a path, and cargo fails
# to LOAD a manifest whose declared target file is missing — so a package that
# dropped them could not even be verified. `examples/` and the fixture corpus are
# excluded: they are measurement tools that generate their own inputs into
# `target/`, and no consumer of the library needs either.
exclude = ["examples/**"]
# `benches/corpus.rs` is a SHARED MODULE (the deterministic journal generator),
# not a bench target: `benches/engine.rs` and the `examples/` measurement
# binaries `#[path]`-include it. Auto-discovery would try to build it as its own
# harness-less bench and fail for want of a `main`.
autobenches = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
itertools = { workspace = true }
ropey = { workspace = true }
csv = { workspace = true }
# Statement preprocessors (WP-11) — see the workspace Cargo.toml for why each.
calamine = { workspace = true }
encoding_rs = { workspace = true }
encoding_rs_io = { workspace = true }
chardetng = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
proptest-derive = { workspace = true }
# Benchmarking. Declared here rather than in the
# workspace table because `ledgeline-core` is the only crate that benches. The
# skill's `async_tokio` feature is deliberately NOT enabled: the engine is
# entirely synchronous and has no runtime to drive.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

# Bench layout: criterion supplies its own harness,
# and the libtest harness must not also claim `--bench` (it would shadow
# criterion's CLI and report zero benchmarks).
[[bench]]
name = "engine"
path = "benches/engine.rs"
harness = false

[lib]
bench = false
