[package]
# The PACKAGE is `ledgeline` but the DIRECTORY is `crates/ledgeline-server/`,
# deliberately. Cargo does not tie the two together, and the name is what a user
# types (`cargo install ledgeline`) while the directory is only ever seen by us.
# The directory keeps its name so that the paths cited throughout `docs/` and
# `flake.nix` stay valid.
name = "ledgeline"
description = "Ledgeline: a local-first UI for hledger journals — desktop app and HTTP server."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["hledger", "accounting", "ledger", "finance"]
categories = ["command-line-utilities", "finance"]

# An EXPLICIT allowlist, because `spa/` (the built SvelteKit UI that `build.rs`
# populates and `spa.rs` embeds) is git-ignored — it is a build artifact, and
# committing it would churn the repo on every UI change. Cargo's default
# packaging honours .gitignore and would therefore publish a crate with no UI.
# Naming `include` overrides that, and it is also why the publish workflow
# asserts the SPA is real before pushing: a placeholder would package just as
# happily as the genuine article.
#
# `tests/` is deliberately absent. Those suites read the repo's `fixtures/` tree
# at RUNTIME through `../../fixtures`, which does not exist for anyone who
# installed this from crates.io, so shipping them would only ever produce
# confusing failures.
include = [
    "src/**/*",
    "spa/**/*",
    "build.rs",
    "Cargo.toml",
]

[[bin]]
name = "ledgeline"
path = "src/main.rs"

[features]
# The desktop GUI (wry/tao/muda/rfd) is on by default, with the two host
# capabilities a desktop has and a sandboxed host (iOS) does not:
#
# - `watcher` — live reload from a `notify` file watcher over the journal's
#   real directories. Without it, a host calls `AppState::refresh()` (a
#   vault-based content check) when it wants to pick up external edits.
# - `external-tools` — running `hledger` (imports, rules previews) and `git`
#   (the import safety net) as subprocesses. They need a real path for the
#   journal (`Vault::local_path`); without the feature they report that this
#   build cannot run them.
#
# `--no-default-features` builds the bare engine + HTTP server with none of
# them. The headless server CI and Linux hosts run is
# `--no-default-features --features watcher,external-tools`.
default = ["gui", "watcher", "external-tools"]
watcher = ["dep:notify"]
external-tools = []
gui = [
    "watcher",
    "dep:wry",
    "dep:tao",
    "dep:muda",
    "dep:rfd",
    "dep:url",
    "dep:gtk",
    "dep:webkit2gtk",
]

[dependencies]
ledgeline-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# Stock price updates: fetching quotes from Yahoo Finance's public chart
# endpoint. `rustls`, not `native-tls` (IronCore Rust standard); only the
# features this crate actually calls (`.json()` is unused — the response is
# read as raw bytes so `yahoo::parse_chart_response` stays testable without a
# live `reqwest::Response`).
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "query",
] }
# Fallback trust roots for `yahoo::http_client` when the OS has no certificate
# store reqwest's platform verifier can load. Already in the graph via
# rustls-platform-verifier, so this adds no crate.
webpki-root-certs = "1"
# `PriceFeed` (`yahoo.rs`) needs to be a `dyn` trait object on `AppState` so the
# integration tests can substitute a fake with no network — native
# async-fn-in-trait is not `dyn`-safe on stable, hence this.
async-trait = "0.1"
# Bounded-concurrency fan-out over the symbols being priced (`prices_api.rs`),
# the same `buffer_unordered` pattern used throughout this codebase's own style
# guide for batch I/O.
futures = "0.3"
# `catch-panic` turns a handler panic into a 500 instead of a dropped connection
# (SEC-2); `set-header` carries the security headers (SEC-7); `cors` is only
# reachable through the opt-in `--allow-origin` allowlist (SEC-1);
# `compression-gzip` shrinks the /transactions body ~20:1 on the wire (PERF-2).
tower-http = { version = "0.7", features = [
    "catch-panic",
    "compression-gzip",
    "cors",
    "set-header",
] }
# Local-access control (SEC-1): `getrandom` is the OS CSPRNG behind the
# per-process bearer token; `sha2` + `base64` compute the CSP script hashes.
getrandom = { version = "0.4", features = ["std"] }
sha2 = "0.11"
base64 = "0.23"
# CLI, embedded SPA, and hot-swappable journal state — needed in both the GUI
# and headless builds, so none of these are feature-gated.
clap = { version = "4", features = ["derive"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
arc-swap = "1"
# Live reload (the `watcher` feature): a file watcher over the journal's real
# directories. A host without one polls `AppState::refresh()` instead.
notify = { version = "8", optional = true }
# Locate the per-user config directory for the "recently opened journals" store
# (used in both the GUI and headless builds).
dirs = "7"
# Desktop GUI stack (gated by the `gui` feature). On macOS wry links the system
# WKWebView; Linux needs webkitgtk (see flake.nix).
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }
muda = { version = "0.21", optional = true }
rfd = { version = "0.17", optional = true }
# macOS hands a double-clicked document to the app as a `file://` URL, which tao
# surfaces as `Event::Opened { urls: Vec<url::Url> }`. tao does NOT re-export
# `url`, so we depend on it directly to call `Url::to_file_path()` (which undoes
# the percent-encoding — journal paths with spaces are common). This is already
# in the tree as a tao dependency, so cargo unifies it and it costs no new build.
url = { version = "2", optional = true }

# Linux hides the in-window GtkMenuBar by default (F10 toggles it), which needs
# to name `gtk::Settings` and `gtk::Widget` directly. gtk 0.18 is ALREADY in the
# tree via tao/muda/webkit2gtk, so cargo unifies it and this adds no crate to the
# graph — only a direct path to types we were already linking.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
# Needed for `terminate_web_process()` on shutdown — see `stop_web_process` in
# gui.rs. Like `gtk`, this is ALREADY in the tree (wry links it), so cargo
# unifies it and this adds no crate to the graph.
webkit2gtk = { version = "2.0", optional = true }

# `setrlimit` for the workbook worker (`workbook_sandbox`): safe, where `libc`'s
# is `unsafe`. Already in the tree (via tempfile, and wayland on Linux), so this
# adds no crate to Cargo.lock — only the `process` feature.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Builds the allocation-bomb workbooks the spreadsheet tests feed the reader.
# Already in the tree via calamine (same major, same feature), so this adds no
# crate to Cargo.lock.
zip = { version = "9", default-features = false, features = ["deflate"] }
# Isolated temp dirs for the recents-store unit tests.
tempfile = "3"
