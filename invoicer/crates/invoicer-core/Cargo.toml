[package]
name = "invoicer-core"
description = "Ledgeline Invoicer core: invoice documents, the bill-table engine and the booking bridge."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# See ledgeline-core: benches are named explicitly below.
autobenches = false

[dependencies]
ledgeline-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `[invoicer.words]` is read out of `ledgeline.toml`. toml 0.9 is already in
# Cargo.lock (through the server's build graph), so this adds no crate.
toml = "0.9"
# The Settings page writes `[invoicer]` through toml_edit's document model
# (`settings_edit`), so comments, key order and other tables come back byte
# for byte, as Ledgeline's own `ledgeline.toml` writers do. The version
# ledgeline-core uses, so this adds no crate.
toml_edit = "0.25"
# Column alignment by display width, so a CJK or emoji description still
# lines up in a monospace editor. Already in Cargo.lock.
unicode-width = "0.2"
# Frontmatter is read with the YAML parser MBR uses (ARCHITECTURE §5.5,
# PLAN 1b), so a note reads the same here as in MBR: YAML 1.2 core schema
# (`no` is a string, `2026-11-17` is a string), insertion-ordered maps. The
# one new crate family this PR adds (with `hashlink` and `arraydeque`); pure
# Rust, no unsafe in the parser. Default features off, as MBR has them.
yaml-rust2 = { version = "0.13", default-features = false }
# `customers import-csv` reads a customer list with the CSV reader
# ledgeline-core's imports use (the workspace's `csv`, already in
# Cargo.lock): RFC 4180 quoting, so a quoted field may hold commas, quotes
# and line breaks.
csv = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# A private copy of a fixture for the tests that write (already in
# Cargo.lock).
tempfile = "3"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# The table engine's interactive paths against ARCHITECTURE §5.6 (budget:
# under 1 ms each).
[[bench]]
name = "table"
path = "benches/table.rs"
harness = false

# The document engine on the §5.6 corpus (5,000 invoices, 500 customers,
# 10 years of journal): open, list, check, refresh, save, and Ledgeline's
# journal reload. `benches/invoicer_corpus.rs` is a shared module, not a
# target (autobenches is off).
[[bench]]
name = "documents"
path = "benches/documents.rs"
harness = false

[lib]
bench = false
